name: Android build

on:
  push:
    branches:
      - main
      - codex/native-secureasset-android
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android platform and build tools
        run: |
          set -euo pipefail
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root/platforms/android-37.0"
          ln -sfn android-37.0 "$sdk_root/platforms/android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Assemble debug and release APKs
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: secureasset-android-apks-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
